apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml

configMapGenerator:
  - name: contracts-webapi-mongodb-init
    files:
      - params/init-db.js
  - name: contracts-webapi-config
    literals:
      - database=contracts
      - collection=contracts
patches:
- path: patches/webapi.deployment.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: contracts-webapi